name: ps_keyboard
description: "PS Keyboard - Premium Android Keyboard Application with Sinhala, English, Secret Encoder, Custom Themes and Smart Tools."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.4.9

  # Local Persistence
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Security & Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # UI, Design & Animations
  google_fonts: ^6.1.0
  flutter_emoji: ^2.5.0
  lottie: ^2.7.0
  dynamic_color: ^1.6.8
  flutter_vibrate: ^1.3.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A1A"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/
